name: Vinted Deal Hunter Workflow

on:
  schedule:
    # Runs automatically every 10 minutes!
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to manually trigger it from your phone/browser anytime!

jobs:
  run-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Vinted Bot
        env:
          DISCORD_WEBHOOK_CARHARTT: ${{ secrets.DISCORD_WEBHOOK_CARHARTT }}
          DISCORD_WEBHOOK_RL: ${{ secrets.DISCORD_WEBHOOK_RL }}
          DISCORD_WEBHOOK_SUPREME: ${{ secrets.DISCORD_WEBHOOK_SUPREME }}
          DISCORD_WEBHOOK_STUSSY: ${{ secrets.DISCORD_WEBHOOK_STUSSY }}
        run: python main.py
