name: Deal Hunter Workflow

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-hunter
  cancel-in-progress: false

jobs:
  run-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK_CARHARTT: ${{ secrets.DISCORD_WEBHOOK_CARHARTT }}
          DISCORD_WEBHOOK_RALPHLAUREN: ${{ secrets.DISCORD_WEBHOOK_RALPHLAUREN }}
          DISCORD_WEBHOOK_STUSSY: ${{ secrets.DISCORD_WEBHOOK_STUSSY }}
          DISCORD_WEBHOOK_NIKE: ${{ secrets.DISCORD_WEBHOOK_NIKE }}
        run: python main.py

      - name: Save seen items and stats
        run: |
          git config user.name "hunter-bot"
          git config user.email "hunter-bot@users.noreply.github.com"
          git add seen.json stats.json
          if ! git diff --cached --quiet; then
            git commit -m "update bot state"
            git pull --rebase
            git push
          fi
