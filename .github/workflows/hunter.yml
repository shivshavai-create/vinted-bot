name: Deal Hunter Workflow

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-hunter
  cancel-in-progress: false

jobs:
  run-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        timeout-minutes: 16
        env:
          DISCORD_WEBHOOK_CARHARTT: ${{ secrets.DISCORD_WEBHOOK_CARHARTT }}
          DISCORD_WEBHOOK_MERTRA: ${{ secrets.DISCORD_WEBHOOK_MERTRA }}
        run: python main.py

      - name: Save bot state
        if: always()
        run: |
          git config user.name "hunter-bot"
          git config user.email "hunter-bot@users.noreply.github.com"
          for f in seen.json stats.json alerted.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "update bot state"
            git pull --rebase
            git push
          fi
